<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevOps Pipeline Project</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 30px 50px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid #334155;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 20px;
      background-color: #2563eb;
      color: #fff;
      margin-bottom: 15px;
    }
    h1 { margin: 10px 0; color: #38bdf8; }
    p { color: #94a3b8; font-size: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">VERSION 1.0 - BLUE</div>
    <h1>CI/CD Deployment Successful</h1>
    <p>Automated with Git, Jenkins Pipeline, DockerHub & Kubernetes Rolling Update.</p>
  </div>
</body>
</html>
